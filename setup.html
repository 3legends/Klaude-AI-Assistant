<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Klaude Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; cursor: default !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      color: rgba(255,255,255,0.92);
      width: 100vw; height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%; height: 100%;
      background: linear-gradient(145deg, rgba(10,10,10,0.98) 0%, rgba(18,18,18,0.98) 100%);
      backdrop-filter: blur(30px);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow: 0 32px 100px rgba(0,0,0,0.8);
      display: flex; flex-direction: column;
      -webkit-app-region: drag;
    }

    /* ── Header ── */
    .header {
      padding: 20px 22px 15px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .logo span { color: #c8f060; }
    .badge {
      font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
      background: rgba(200,240,96,0.1); border: 1px solid rgba(200,240,96,0.22);
      color: #c8f060; padding: 3px 10px; border-radius: 20px;
    }
    .header-sub { margin-top: 5px; font-size: 11.5px; color: rgba(255,255,255,0.38); line-height: 1.5; }

    /* ── Body ── */
    .body {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 16px 20px;
      -webkit-app-region: no-drag;
      display: flex; flex-direction: column; gap: 10px;
    }
    .body::-webkit-scrollbar { width: 3px; }
    .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    /* ── Check card ── */
    .check-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 14px 16px;
      transition: border-color 0.25s;
    }
    .check-card.ok   { border-color: rgba(74,222,128,0.22); }
    .check-card.warn { border-color: rgba(248,113,113,0.22); }
    .check-card.idle { border-color: rgba(255,255,255,0.07); }

    .check-row { display: flex; align-items: center; gap: 12px; }
    .check-icon {
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .check-icon.ok   { background: rgba(74,222,128,0.11); }
    .check-icon.warn { background: rgba(248,113,113,0.11); }
    .check-icon.idle { background: rgba(255,255,255,0.05); }

    .check-info { flex: 1; min-width: 0; }
    .check-label { font-size: 13px; font-weight: 600; margin-bottom: 1px; }
    .check-detail { font-size: 11px; color: rgba(255,255,255,0.38); line-height: 1.45; }

    .check-status {
      font-size: 10.5px; font-weight: 500; white-space: nowrap;
      padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
    }
    .check-status.ok   { background: rgba(74,222,128,0.1);  color: #4ade80; }
    .check-status.warn { background: rgba(248,113,113,0.1); color: #f87171; }
    .check-status.idle { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.35); }

    /* ── Gemini inline input ── */
    .gemini-input-block { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .key-row { display: flex; gap: 7px; align-items: center; }
    .key-input {
      flex: 1; padding: 9px 12px;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px; color: rgba(255,255,255,0.9); font-size: 12.5px;
      font-family: 'SF Mono', 'Fira Code', Consolas, monospace; letter-spacing: 0.04em;
      outline: none; cursor: text !important;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .key-input:focus { border-color: rgba(200,240,96,0.4); box-shadow: 0 0 0 3px rgba(200,240,96,0.06); }
    .key-input::placeholder { color: rgba(255,255,255,0.2); letter-spacing: 0; font-size: 12px; }

    .btn-save-key {
      padding: 9px 15px; border-radius: 7px; border: none;
      background: rgba(200,240,96,0.15); border: 1px solid rgba(200,240,96,0.3);
      color: #c8f060; font-size: 12px; font-weight: 500;
      cursor: pointer !important; white-space: nowrap;
      transition: background 0.15s; -webkit-app-region: no-drag;
    }
    .btn-save-key:hover:not(:disabled) { background: rgba(200,240,96,0.25); }
    .btn-save-key:disabled { opacity: 0.4; cursor: not-allowed !important; }

    .key-status { font-size: 11px; min-height: 16px; line-height: 1.4; display: flex; align-items: center; gap: 5px; }
    .key-status.testing { color: rgba(255,255,255,0.4); }
    .key-status.ok      { color: #4ade80; }
    .key-status.fail    { color: #f87171; }

    /* ── Progress bar (dep-check after key verified) ── */
    .progress-section {
      display: none; flex-direction: column; gap: 6px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
    }
    .progress-section.visible { display: flex; }
    .progress-label-row { display: flex; justify-content: space-between; align-items: center; }
    .progress-text { font-size: 11.5px; color: rgba(255,255,255,0.55); }
    .progress-pct  { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; color: rgba(255,255,255,0.3); }
    .progress-bar-bg {
      height: 3px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: #c8f060; border-radius: 2px;
      transition: width 0.4s ease; width: 0%;
    }

    /* ── Footer ── */
    .footer {
      padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.06);
      -webkit-app-region: no-drag;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .footer-note { font-size: 11px; color: rgba(255,255,255,0.28); flex: 1; line-height: 1.4; }
    .footer-note.ready { color: rgba(74,222,128,0.8); }

    .btn-continue {
      padding: 10px 24px; border-radius: 7px; border: none;
      background: #c8f060; color: #080808;
      font-size: 13px; font-weight: 700; letter-spacing: -0.01em;
      cursor: pointer !important; white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-continue:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn-continue:disabled { opacity: 0.25; cursor: not-allowed !important; transform: none; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-row">
      <div class="logo">Klaude<span>.</span></div>
      <div class="badge">Setup</div>
    </div>
    <div class="header-sub">Add your Gemini API key to get started. Sox and Whisper are bundled and ready.</div>
  </div>

  <div class="body" id="body">
    <!-- Cards injected by JS -->
  </div>

  <div class="footer">
    <div class="footer-note" id="footerNote">Checking components…</div>
    <button class="btn-continue" id="btnContinue" onclick="finish()" disabled>Launch Klaude →</button>
  </div>

</div>
<script>
  // ── state ──────────────────────────────────────────────────────────────────
  let _geminiOk = false;

  // ── init: wait for electronAPI ────────────────────────────────────────────
  function waitForAPI(cb, tries) {
    tries = tries || 0;
    if (window.electronAPI && window.electronAPI.getDepCheckResults) {
      cb(window.electronAPI);
    } else if (tries < 40) {
      setTimeout(() => waitForAPI(cb, tries + 1), 50);
    }
  }

  waitForAPI(function(api) {
    if (api.onSetupCheckResults) api.onSetupCheckResults(render);
    api.getDepCheckResults().then(render).catch(console.error);
  });

  // ── render ────────────────────────────────────────────────────────────────
  function render(results) {
    _geminiOk = results.gemini.ok;
    const body = document.getElementById('body');
    body.innerHTML = '';
    body.appendChild(buildGeminiCard(results.gemini));
    body.appendChild(buildBundledCard('Sox audio recorder', 'Voice recording engine.', results.sox.ok));
    body.appendChild(buildBundledCard('Whisper speech model', 'Local transcription model (base.en).', results.whisper.ok));

    // Progress section (shown after Gemini key verified)
    const prog = document.createElement('div');
    prog.className = 'progress-section' + (_geminiOk && results.sox.ok && results.whisper.ok ? ' visible' : '');
    prog.id = 'progressSection';
    prog.innerHTML = `
      <div class="progress-label-row">
        <span class="progress-text" id="progressText">Verifying components…</span>
        <span class="progress-pct" id="progressPct"></span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
    `;
    body.appendChild(prog);

    updateFooter(results);

    // If all deps ready and key already set — auto-run check
    if (results.allOk) runDepCheckProgress();
  }

  // ── Gemini card ───────────────────────────────────────────────────────────
  function buildGeminiCard(c) {
    const div = makeCard(c.ok ? 'ok' : 'warn');
    const row = makeRow(c.ok ? 'ok' : 'warn', c.ok ? '✓' : '✗', 'Gemini API key',
      c.ok ? 'Key stored and encrypted.' : 'Required to use AI features.',
      c.ok ? 'Ready' : 'Not set');
    div.appendChild(row);

    if (!c.ok) {
      const block = el('div', 'gemini-input-block');
      const keyRow = el('div', 'key-row');

      const inp = document.createElement('input');
      inp.type = 'password'; inp.id = 'geminiKeyInput'; inp.className = 'key-input';
      inp.placeholder = 'Paste your Gemini API key (AIza…)';
      inp.style.cursor = 'text';
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveKey(); });

      const btn = el('button', 'btn-save-key');
      btn.id = 'geminiSaveBtn'; btn.textContent = 'Save & test';
      btn.setAttribute('onclick', 'saveKey()');

      keyRow.appendChild(inp); keyRow.appendChild(btn);

      const status = el('div', 'key-status');
      status.id = 'geminiKeyStatus';

      block.appendChild(keyRow); block.appendChild(status);
      div.appendChild(block);
    }

    return div;
  }

  // ── Bundled component card (Sox, Whisper) ─────────────────────────────────
  function buildBundledCard(label, detail, ok) {
    const div = makeCard(ok ? 'ok' : 'idle');
    div.appendChild(makeRow(
      ok ? 'ok' : 'idle',
      ok ? '✓' : '○',
      label,
      ok ? detail : 'Checking…',
      ok ? 'Ready' : 'Checking'
    ));
    return div;
  }

  // ── Save Gemini key ───────────────────────────────────────────────────────
  async function saveKey() {
    const api    = window.electronAPI;
    const inp    = document.getElementById('geminiKeyInput');
    const btn    = document.getElementById('geminiSaveBtn');
    const status = document.getElementById('geminiKeyStatus');
    const key    = inp ? inp.value.trim() : '';
    if (!key) return;

    btn.disabled = true; btn.textContent = 'Saving…';
    setStatus(status, 'testing', '⏳ Saving and testing connection…');

    try {
      await api.setGeminiApiKey(key);
      const result = await api.testGeminiConnection();
      if (result && result.success) {
        setStatus(status, 'ok', '✓ Connected successfully');
        // Re-check all deps and refresh UI
        setTimeout(async () => {
          const results = await api.getDepCheckResults();
          render(results);
        }, 400);
      } else {
        const msg = (result && result.error) ? result.error : 'Connection failed';
        setStatus(status, 'fail', '✗ ' + msg.slice(0, 70));
        btn.disabled = false; btn.textContent = 'Save & test';
      }
    } catch(e) {
      setStatus(status, 'fail', '✗ ' + (e.message || 'Unknown error'));
      btn.disabled = false; btn.textContent = 'Save & test';
    }
  }

  // ── Dep-check progress animation (runs after key verified) ───────────────
  async function runDepCheckProgress() {
    const section = document.getElementById('progressSection');
    const fill    = document.getElementById('progressFill');
    const text    = document.getElementById('progressText');
    const pct     = document.getElementById('progressPct');
    if (!section) return;

    section.classList.add('visible');

    const steps = [
      { p: 20, t: 'Verifying Gemini connection…' },
      { p: 50, t: 'Checking Sox audio engine…'   },
      { p: 80, t: 'Verifying Whisper model…'      },
      { p: 100, t: 'All components ready ✓'       },
    ];

    for (const step of steps) {
      fill.style.width = step.p + '%';
      text.textContent  = step.t;
      pct.textContent   = step.p + '%';
      await sleep(320);
    }

    // Final real check
    const results = await window.electronAPI.getDepCheckResults();
    if (results.allOk) {
      text.textContent = '✓ All components verified. Ready to launch.';
      pct.textContent  = '';
      enableLaunch();
    } else {
      text.textContent = 'Some components not ready. Please reinstall Klaude.';
      fill.style.background = '#f87171';
    }
  }

  // ── Footer + launch button ────────────────────────────────────────────────
  function updateFooter(results) {
    const note = document.getElementById('footerNote');
    const btn  = document.getElementById('btnContinue');

    if (!results.gemini.ok) {
      note.textContent = 'Enter your Gemini API key above to continue.';
      note.className   = 'footer-note';
      btn.disabled     = true;
    } else if (!results.allOk) {
      note.textContent = 'Verifying bundled components…';
      note.className   = 'footer-note';
      btn.disabled     = true;
    } else {
      note.textContent = 'Completing setup…';
      note.className   = 'footer-note';
      btn.disabled     = true;
      // Will be enabled by runDepCheckProgress on completion
    }
  }

  function enableLaunch() {
    const note = document.getElementById('footerNote');
    const btn  = document.getElementById('btnContinue');
    note.textContent = '✓ Ready to launch.';
    note.className   = 'footer-note ready';
    btn.disabled     = false;
    btn.textContent  = 'Launch Klaude →';
  }

  async function finish() {
    const btn = document.getElementById('btnContinue');
    btn.disabled = true; btn.textContent = 'Launching…';
    try {
      if (window.electronAPI && window.electronAPI.setupComplete) {
        await window.electronAPI.setupComplete();
      }
    } catch(e) { console.error(e); }
  }

  // ── DOM helpers ───────────────────────────────────────────────────────────
  function el(tag, cls) {
    const d = document.createElement(tag);
    if (cls) d.className = cls;
    return d;
  }

  function makeCard(state) {
    return el('div', 'check-card ' + state);
  }

  function makeRow(iconState, iconChar, label, detail, statusText) {
    const row  = el('div', 'check-row');
    const icon = el('div', 'check-icon ' + iconState);
    icon.textContent = iconChar;
    const info = el('div', 'check-info');
    const lbl  = el('div', 'check-label'); lbl.textContent = label;
    const det  = el('div', 'check-detail'); det.textContent = detail;
    info.appendChild(lbl); info.appendChild(det);
    const status = el('div', 'check-status ' + iconState);
    status.textContent = statusText;
    row.appendChild(icon); row.appendChild(info); row.appendChild(status);
    return row;
  }

  function setStatus(el, cls, text) {
    el.className = 'key-status ' + cls;
    el.textContent = text;
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
</html>
